# -----------------------------
# Power management (CRITICAL)
# -----------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Disable high-speed PHY to save radio strain
CONFIG_BT_CTLR_PHY_2M=n

# Ensure external power is managed
CONFIG_ZMK_EXT_POWER=y

# -----------------------------
# Onboard OLED (each half has one) - turn off if not populated on your PCB
# -----------------------------
CONFIG_ZMK_DISPLAY=n

# -----------------------------
# Disable power-hungry features
# -----------------------------
# RGB Underglow (OFF)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_POINTING=y

# -----------------------------
# Logging (OFF)
# -----------------------------
CONFIG_LOG=n
